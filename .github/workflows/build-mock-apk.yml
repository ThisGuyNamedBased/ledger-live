name: Build mock APK

# Manual only: builds a staging-release Android APK with mock mode baked in,
# so the dev panel can be exercised on a phone without a Ledger device.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app bundles against the workspace libs' compiled output, so they
      # have to be built before Metro/repack can resolve @ledgerhq/* imports.
      - name: Build workspace libraries
        run: pnpm build:llm:deps

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.12674087"

      - name: Build APK
        working-directory: apps/ledger-live-mobile/android
        env:
          ENVFILE: .env.mockdev
        run: ./gradlew assembleStagingRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ledger-live-mock-apk
          path: apps/ledger-live-mobile/android/app/build/outputs/apk/stagingRelease/*.apk
          if-no-files-found: error
